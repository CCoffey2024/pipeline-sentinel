name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install project
        run: uv sync --group dev

      - name: Validate release tag and package version
        run: uv run python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Generate release checksums
        run: uv run python scripts/generate_checksums.py dist

      - name: Smoke test built wheel
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv .release-test
          .release-test/bin/python -m pip install dist/*.whl
          .release-test/bin/pipeline-sentinel --version | grep "${VERSION}"
          .release-test/bin/python -m pipeline_sentinel --version | grep "${VERSION}"
          .release-test/bin/python -c "from pipeline_sentinel.config import load_production_config; c, _ = load_production_config(); assert c.detector.imgsz == 960"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Pipeline Sentinel ${GITHUB_REF_NAME}"
