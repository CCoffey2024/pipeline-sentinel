name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke test built wheel
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/pipeline-sentinel --version
          .wheel-test/bin/python -c "from pipeline_sentinel.config import load_production_config; c, _ = load_production_config(); assert c.detector.imgsz == 960"
