name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --group dev
      - name: Validate release metadata
        run: uv run python scripts/check_release_version.py
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Generate checksums
        run: uv run python scripts/generate_checksums.py dist
      - name: Smoke test built wheel
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/pipeline-sentinel --version
          .wheel-test/bin/python -m pipeline_sentinel --version
          .wheel-test/bin/pipeline-sentinel-fit-reference --help > /dev/null
          .wheel-test/bin/pipeline-sentinel-operator --help > /dev/null
          .wheel-test/bin/python -c "from pathlib import Path; import pipeline_sentinel; p=Path(pipeline_sentinel.__file__).parent / 'web'; assert (p / 'operator.html').is_file() and (p / 'local-sources.js').is_file() and (p / 'results-console.js').is_file()"
          .wheel-test/bin/python -c "from pipeline_sentinel.image_sources import UavdtDataset, ImageFolderSequence; assert UavdtDataset and ImageFolderSequence"
          .wheel-test/bin/python -c "from pipeline_sentinel.config import load_production_config; c, _ = load_production_config(); assert c.detector.imgsz == 960 and c.anomaly.enabled is False"
          .wheel-test/bin/python -c "from pipeline_sentinel.fusion import load_fusion_config; c, _ = load_fusion_config(); assert c.strategy == 'temporal_consensus' and c.min_sensors == 2"
      - name: Upload candidate distributions
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-sentinel-dist-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows-mvp:
    name: Windows MVP acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install source test environment
        run: uv sync --group dev
      - name: Validate release metadata
        run: uv run python scripts/check_release_version.py
      - name: Lint
        run: uv run ruff check .
      - name: Test on Windows
        run: uv run pytest
      - name: Build Windows candidate wheel
        run: uv build
      - name: Clean-install operator wheel and smoke test
        shell: pwsh
        run: |
          $wheel = Get-ChildItem .\dist\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel was built" }
          python -m venv .operator-wheel-test
          & .\.operator-wheel-test\Scripts\python.exe -m pip install "$($wheel.FullName)[operator]"
          & .\.operator-wheel-test\Scripts\pipeline-sentinel.exe --version
          & .\.operator-wheel-test\Scripts\pipeline-sentinel-operator.exe --version
          & .\.operator-wheel-test\Scripts\python.exe -c "import importlib.util; assert importlib.util.find_spec('ultralytics') is None, 'operator extra must not install Ultralytics'"
          & .\.operator-wheel-test\Scripts\python.exe -c "from pathlib import Path; import pipeline_sentinel; p=Path(pipeline_sentinel.__file__).parent / 'web'; assert (p / 'operator.html').is_file() and (p / 'local-sources.js').is_file() and (p / 'results-console.js').is_file()"
          & .\.operator-wheel-test\Scripts\python.exe -c "from pathlib import Path; from pipeline_sentinel.service import create_app; app=create_app(workspace=Path('.operator-smoke')); paths={getattr(r, 'path', None) for r in app.routes}; assert '/api/jobs/media' in paths; assert '/api/jobs/local-sequence' in paths; app.state.job_manager.close()"
