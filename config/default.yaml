project:
  name: pipeline-sentinel
  version: 0.13.0

ingest:
  sample_every_n: 2
  frame_format: jpg

# The deterministic reference backend remains the safe default for software-plumbing tests.
# Learned detector runtimes are selected explicitly through CLI/configuration.
detector:
  backend: ground_truth
  yolo:
    model: yolo26n.pt
    confidence: 0.25
    iou: 0.70
    imgsz: 640
    device: null
    class_ids: null

tracking:
  backend: iou
  iou_threshold: 0.30
  max_missed_updates: 2

representation:
  enabled: false
  backend: dinov2
  model: dinov2_vits14
  device: null
  labels: null
  min_track_hits: 3
  sample_every_n_hits: 15
  max_per_frame: 16
  pad_px: 6
  min_crop_size: 12

anomaly:
  enabled: false
  backend: dinov2
  reference_path: null
  model: dinov2_vits14
  device: null
  labels: null
  min_track_hits: 3
  pad_px: 6
  min_crop_size: 12
  event_min_consecutive: 3
  event_severity: warning

events:
  dwell:
    enabled: false
    min_hits: 30
    max_displacement_px: 40.0
    labels: null

alerts:
  policy: severity
  minimum_severity: warning

fusion:
  strategy: temporal_consensus
  max_time_delta_s: 0.50
  min_sensors: 2
  require_matching_label: true
  # Set only for sensor products registered into a common pixel geometry.
  spatial_iou_threshold: null

output:
  annotated_video: true
  detections_csv: true
  tracks_csv: true
  anomalies_csv: true
  events_csv: true
  alerts_csv: true
  run_manifest: true

datasets:
  visdrone:
    # Paths stay outside version-controlled defaults. Supply the local train/val root on the CLI.
    render_fps: 30.0
    frame_step: 1
    max_frames: null

benchmarks:
  coco:
    enabled: false
    target_classes:
      - person
      - car
      - truck
      - bus
      - motorcycle
      - bicycle
      - airplane
  visdrone:
    enabled: false
    # Initial zero-shot comparison should use the validation split; train is reserved for fitting.
    split: val
    evaluator: pipeline-sentinel-visdrone-shared-v1
    iou_threshold: 0.50
    shared_classes:
      - person
      - bicycle
      - motor
      - car
      - truck
      - bus
