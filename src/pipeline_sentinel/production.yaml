detector:
  backend: yolo
  model: yolo26n.pt
  confidence: 0.25
  nms_iou: 0.70
  imgsz: 960
  device: null
  class_ids: null

tracker:
  backend: iou
  iou_threshold: 0.30
  max_missed_updates: 2

representation:
  enabled: true
  backend: dinov2
  model: dinov2_vits14
  device: null
  labels:
    - person
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
  min_track_hits: 3
  sample_every_n_hits: 15
  max_per_frame: 16
  pad_px: 6
  min_crop_size: 12

anomaly:
  enabled: false
  backend: dinov2
  reference_path: null
  model: dinov2_vits14
  device: null
  labels:
    - person
  min_track_hits: 3
  pad_px: 6
  min_crop_size: 12
  event_min_consecutive: 3
  event_severity: warning

events:
  dwell:
    enabled: false
    min_hits: 30
    max_displacement_px: 40.0
    labels:
      - person

alerts:
  minimum_severity: warning

runtime:
  sensor_id: EO_CAM_01
  modality: EO
