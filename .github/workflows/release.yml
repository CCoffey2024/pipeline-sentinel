name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install project
        run: uv sync --group dev

      - name: Validate release tag and package version
        run: uv run python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Generate release checksums
        run: uv run python scripts/generate_checksums.py dist

      - name: Smoke test built core wheel
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv .release-test
          .release-test/bin/python -m pip install dist/*.whl
          .release-test/bin/pipeline-sentinel --version | grep "${VERSION}"
          .release-test/bin/python -m pipeline_sentinel --version | grep "${VERSION}"
          .release-test/bin/pipeline-sentinel-fit-reference --help > /dev/null
          .release-test/bin/pipeline-sentinel-operator --help > /dev/null
          .release-test/bin/python -c "from pathlib import Path; import pipeline_sentinel; p=Path(pipeline_sentinel.__file__).parent / 'web'; assert (p / 'operator.html').is_file() and (p / 'local-sources.js').is_file() and (p / 'results-console.js').is_file()"
          .release-test/bin/python -c "from pipeline_sentinel.image_sources import UavdtDataset, ImageFolderSequence; assert UavdtDataset and ImageFolderSequence"
          .release-test/bin/python -c "from pipeline_sentinel.config import load_production_config; c, _ = load_production_config(); assert c.detector.imgsz == 960 and c.representation.enabled is True and c.representation.model == 'dinov2_vits14' and c.anomaly.enabled is False"
          .release-test/bin/python -c "from importlib.metadata import requires; deps='\n'.join(requires('pipeline-sentinel') or []).lower(); assert 'ultralytics-opencv-headless' in deps and 'torch' in deps and 'torchvision' in deps"
          .release-test/bin/python -c "from pipeline_sentinel.fusion import load_fusion_config; c, _ = load_fusion_config(); assert c.strategy == 'temporal_consensus' and c.min_sensors == 2"

      - name: Smoke test built operator wheel
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "${WHEEL}"
          python -m venv .operator-release-test
          .operator-release-test/bin/python -m pip install "${WHEEL}[operator]"
          .operator-release-test/bin/pipeline-sentinel-operator --version | grep "${VERSION}"
          .operator-release-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('ultralytics') is None and importlib.util.find_spec('torch') is None, 'operator extra must not install model providers'"
          .operator-release-test/bin/python -c "from pathlib import Path; import pipeline_sentinel; p=Path(pipeline_sentinel.__file__).parent / 'web'; assert (p / 'operator.html').is_file() and (p / 'local-sources.js').is_file() and (p / 'results-console.js').is_file()"
          .operator-release-test/bin/python -c "from pathlib import Path; from pipeline_sentinel.service import create_app; app=create_app(workspace=Path('.operator-release-smoke')); paths=set(app.openapi()['paths']); assert '/api/jobs/media' in paths; assert '/api/jobs/local-sequence' in paths; assert '/api/jobs/{job_id}/representations' in paths; assert '/api/jobs/{job_id}/preview-frame' in paths; app.state.job_manager.close()"

      - name: Verify shipment documentation
        shell: bash
        run: |
          test -s TESTER-QUICKSTART.md
          test -s RELEASE-NOTES.md
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          grep -q "0.13.0" TESTER-QUICKSTART.md
          grep -q "0.13.0" RELEASE-NOTES.md
          grep -q "operator,yolo,dinov2" TESTER-QUICKSTART.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            TESTER-QUICKSTART.md \
            RELEASE-NOTES.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --notes-file RELEASE-NOTES.md \
            --title "Pipeline Sentinel ${GITHUB_REF_NAME}"
