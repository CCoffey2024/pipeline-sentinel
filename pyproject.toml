[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pipeline-sentinel"
dynamic = ["version"]
description = "A modular computer-vision application for ingest, detection, tracking, anomaly scoring, event generation, sensor fusion, and human-facing alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Chris Coffey" }
]
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
yolo = [
  "ultralytics-opencv-headless>=8.4.147,<9",
]
dinov2 = [
  "torch>=2.2,<3",
]
operator = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/CCoffey2024/pipeline-sentinel"
Issues = "https://github.com/CCoffey2024/pipeline-sentinel/issues"

[dependency-groups]
dev = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pytest>=8.3",
  "ruff>=0.8",
  "uvicorn>=0.35,<1",
]

[project.scripts]
pipeline-sentinel = "pipeline_sentinel.cli:main"
pipeline-sentinel-fit-reference = "pipeline_sentinel.reference:main"
pipeline-sentinel-operator = "pipeline_sentinel.operator_cli:main"

[tool.hatch.version]
path = "src/pipeline_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_sentinel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
